<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>東京迪士尼樂園行程排程板 v16</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --text:#1f2937; --muted:#6b7280; --border:#d9dee7;
  --accent:#2563eb; --dpa:#3b82f6; --pp:#22c55e; --normal:#94a3b8; --danger:#dc2626;
  --slot-h:38px; --restaurant:#f59e0b;
  --area-world:#e8c77b; --area-adventure:#6fb28b; --area-western:#c58d63;
  --area-critter:#8d795f; --area-fantasy:#c99bd8; --area-toon:#ef9d77;
  --area-tomorrow:#79aee8; --area-park:#aab4c0; --area-custom:#d1d5db;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
.app{width:100%;padding:10px}
.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
button{font:inherit}
.tool-btn{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:7px 10px;font-size:13px;color:var(--text)}
.help{font-size:12px;color:var(--muted);line-height:1.45;margin:0 0 8px}
.source-note{font-size:11px;color:var(--muted);margin:0 0 10px}
.save-state{font-size:12px;color:var(--muted);margin-left:auto;align-self:center}
.planner-grid{display:grid;grid-template-columns:minmax(118px,40%) minmax(0,60%);gap:8px;align-items:start}
.left{position:sticky;top:0;align-self:start}
.area-legend{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:9px;font-size:8px;color:var(--muted)}
.area-legend span{display:inline-flex;align-items:center;gap:2px}
.area-legend i{display:inline-block;width:7px;height:7px;border-radius:2px}
.category{margin-bottom:13px}
.category-title{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;margin-bottom:6px;cursor:pointer;user-select:none}.category-title::after{content:'▾';margin-left:auto;font-size:10px;color:var(--muted)}.category.collapsed .category-title::after{content:'▸'}.category.collapsed .item-card{display:none}
.category-count{font-size:10px;font-weight:500;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.dpa{background:var(--dpa)} .dot.pp{background:var(--pp)} .dot.normal{background:var(--normal)} .dot.restaurant{background:var(--restaurant)}
.item-card{touch-action:none;user-select:none;border:1px solid var(--border);background:var(--card);border-radius:11px;padding:8px 7px;margin-bottom:6px;cursor:grab;position:relative;overflow:hidden}
.item-card::after{content:"";position:absolute;right:0;bottom:0;width:38%;height:9px;background:var(--area-color,var(--area-custom));border-top-left-radius:8px;opacity:.92}
.item-card[data-area="世界市集"]{--area-color:var(--area-world)}
.item-card[data-area="探險樂園"]{--area-color:var(--area-adventure)}
.item-card[data-area="西部樂園"]{--area-color:var(--area-western)}
.item-card[data-area="動物天地"]{--area-color:var(--area-critter)}
.item-card[data-area="夢幻樂園"]{--area-color:var(--area-fantasy)}
.item-card[data-area="卡通城"]{--area-color:var(--area-toon)}
.item-card[data-area="明日樂園"]{--area-color:var(--area-tomorrow)}
.item-card[data-area="園區全域"],.item-card[data-area="灰姑娘城堡"]{--area-color:var(--area-park)}
.item-card[data-area=""]{--area-color:var(--area-custom)}
.item-card.selected{outline:2px solid var(--accent)}
.item-card.dragging{opacity:.35}
.item-card.maintenance{border-style:dashed;opacity:.72;background:#fafafa}
.card-name{font-size:13px;font-weight:650;line-height:1.2}
.card-meta{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.3}
.badge-maint{display:inline-flex;margin-top:4px;border-radius:999px;padding:2px 5px;background:#fee2e2;color:#991b1b;font-size:9px;font-weight:700}
.move-row{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.mini-btn{border:1px solid var(--border);border-radius:7px;padding:2px 6px;background:transparent;color:var(--muted);font-size:10px}
.maint-btn{border-color:#fecaca;color:#991b1b;background:#fff}
.right-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.right-title{font-size:14px;font-weight:700}
.selected-hint{font-size:11px;color:var(--muted)}
.timeline{position:relative;border-left:1px solid var(--border);background:rgba(255,255,255,.35)}
.hour{height:calc(var(--slot-h) * 4);position:relative;border-top:1px solid var(--border)}
.hour-label{position:absolute;left:5px;top:4px;font-size:10px;color:var(--muted);pointer-events:none}
.quarter{height:var(--slot-h);border-top:1px dashed rgba(148,163,184,.35)}
.quarter:first-child{border-top:0}
.end-label{font-size:10px;color:var(--muted);padding:4px 0 0 5px}
.scheduled{position:absolute;left:34px;right:3px;min-height:34px;border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:9px;padding:5px;background:var(--card);z-index:2;touch-action:none;user-select:none;overflow:hidden}
.scheduled::after{content:"";position:absolute;right:0;bottom:0;width:38%;height:8px;background:var(--area-color,var(--area-custom));border-top-left-radius:8px;opacity:.95;pointer-events:none}
.scheduled[data-area="世界市集"]{--area-color:var(--area-world)}
.scheduled[data-area="探險樂園"]{--area-color:var(--area-adventure)}
.scheduled[data-area="西部樂園"]{--area-color:var(--area-western)}
.scheduled[data-area="動物天地"]{--area-color:var(--area-critter)}
.scheduled[data-area="夢幻樂園"]{--area-color:var(--area-fantasy)}
.scheduled[data-area="卡通城"]{--area-color:var(--area-toon)}
.scheduled[data-area="明日樂園"]{--area-color:var(--area-tomorrow)}
.scheduled[data-area="園區全域"],.scheduled[data-area="灰姑娘城堡"]{--area-color:var(--area-park)}
.scheduled[data-area=""]{--area-color:var(--area-custom)}

.scheduled.obtained-dpa{background:#dbeafe;border-color:#60a5fa;border-left-color:#2563eb;color:#123b73}
.scheduled.obtained-pp{background:#dcfce7;border-color:#4ade80;border-left-color:#16a34a;color:#14532d}
.scheduled.maint-plan{box-shadow:inset 0 0 0 1px #ef4444}
.scheduled-head{display:flex;align-items:flex-start;gap:4px;padding-right:16px}
.scheduled-name{font-size:12px;font-weight:700;line-height:1.15;min-width:0;flex:1}
.type-badge{flex:none;border-radius:999px;padding:1px 5px;font-size:9px;font-weight:800;border:1px solid currentColor}
.scheduled-time{font-size:10px;color:inherit;opacity:.72;margin-top:2px}
.plan-maint{font-size:9px;color:#b91c1c;font-weight:700;margin-top:2px}
.obtain-btn{display:inline-flex;margin-top:3px;border:1px solid currentColor;background:rgba(255,255,255,.55);border-radius:6px;padding:2px 5px;font-size:9px;color:inherit}
.remove{position:absolute;right:2px;top:1px;border:0;background:transparent;color:inherit;opacity:.55;font-size:14px;padding:2px 4px}
.drag-ghost{position:fixed;z-index:9999;pointer-events:none;max-width:180px;opacity:.92;border:1px solid var(--accent);background:var(--card);border-radius:10px;padding:7px 9px;font-size:12px;transform:translate(-50%,-50%)}
.drop-highlight{background:#eff6ff}

.modal-backdrop{position:fixed;inset:0;background:rgba(17,24,39,.42);display:none;align-items:center;justify-content:center;padding:18px;z-index:12000}
.modal-backdrop.show{display:flex}
.modal-box{width:min(360px,100%);background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 18px 50px rgba(0,0,0,.18)}
.modal-title{font-size:16px;font-weight:800;margin:0 0 7px}
.modal-message{font-size:13px;line-height:1.5;color:var(--muted);margin:0 0 14px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
.modal-btn{border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:8px 12px;font-size:13px;font-weight:650}
.modal-btn.danger{background:#dc2626;border-color:#dc2626;color:#fff}

.toast{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;border-radius:999px;padding:7px 12px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:10000}
.toast.show{opacity:.92}

.tabs{display:flex;gap:6px;margin:0 0 10px}
.tab-btn{flex:1;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:11px;padding:9px 10px;font-size:13px;font-weight:700}
.tab-btn.active{background:#111827;color:#fff;border-color:#111827}
.page-pane{display:none}
.page-pane.active{display:block}
.map-toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
.map-note{font-size:10px;color:var(--muted);line-height:1.35;margin:0 0 7px}
.map-shell{position:relative;width:100%;aspect-ratio:1000/563;overflow:hidden;border:1px solid var(--border);border-radius:12px;background:#eef2f7;touch-action:none}
.map-stage{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0;will-change:transform}
.map-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;user-select:none;pointer-events:none}
.route-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.route-line{fill:none;stroke:#111827;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;opacity:.78}
.map-pin{position:absolute;transform:translate(-50%,-50%);min-width:42px;height:30px;border-radius:999px;border:2px solid #fff;background:#111827;color:#fff;display:flex;align-items:center;justify-content:center;padding:0 7px;font-size:10px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:3}
.map-pin.active{background:var(--accent)}
.map-popup{position:absolute;transform:translate(-50%,calc(-100% - 19px));max-width:170px;background:#111827;color:#fff;border-radius:9px;padding:7px 9px;font-size:10px;line-height:1.35;z-index:5;pointer-events:none}
.map-popup strong{display:block;font-size:11px;margin-bottom:2px}
.map-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;background:rgba(255,255,255,.78);font-size:12px;color:var(--muted);z-index:6}
.zoom-label{font-size:11px;color:var(--muted)}

@media(max-width:430px){
  :root{--slot-h:36px}
  .app{padding:8px}
  .planner-grid{grid-template-columns:minmax(108px,41%) minmax(0,59%);gap:6px}
  .item-card{padding:7px 6px}
  .card-name{font-size:11.5px}
  .card-meta{font-size:9px}
  .mini-btn{padding:2px 5px;font-size:9px}
  .scheduled{left:30px}
  .scheduled-name{font-size:11px}
  .type-badge,.obtain-btn{font-size:8px}
  .hour-label{font-size:9px}
}
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <button id="clearTimeline" class="tool-btn" type="button">清空時間軸</button>
    <button id="resetAll" class="tool-btn" type="button">恢復官方預設</button>
    <button id="authBtn" class="tool-btn" type="button">Google 登入</button>
    <button id="copyUidBtn" class="tool-btn" type="button" style="display:none">複製 UID</button>
    <span class="save-state" id="saveState">本機已儲存</span>
  </div>
  <div id="syncBar" style="font-size:11px;color:#64748b;margin:2px 0 8px">
    尚未登入｜目前先使用本機資料
  </div>
  <p class="help">左側每張卡片會顯示類型・位置・預留時間；右下角色帶代表所在區域，同區域固定同色。手機拖曳時靠近螢幕上／下緣會自動捲動。維修／暫停項目仍會排在該分類最後。</p>
  <p class="source-note">資料基準：東京迪士尼樂園 2026/8/27。DPA／PP 分類依當日可用制度整理。</p>

  <div class="tabs">
    <button id="scheduleTab" class="tab-btn active" type="button">行程</button>
    <button id="mapTab" class="tab-btn" type="button">地圖</button>
  </div>

  <div id="schedulePane" class="page-pane active">
    <div class="planner-grid">
      <section class="left">
        <div class="area-legend">
          <span><i style="background:var(--area-world)"></i>世界</span>
          <span><i style="background:var(--area-adventure)"></i>探險</span>
          <span><i style="background:var(--area-western)"></i>西部</span>
          <span><i style="background:var(--area-critter)"></i>動物</span>
          <span><i style="background:var(--area-fantasy)"></i>夢幻</span>
          <span><i style="background:var(--area-toon)"></i>卡通</span>
          <span><i style="background:var(--area-tomorrow)"></i>明日</span>
        </div>
        <div id="sourceLists"></div>
      </section>
      <section>
        <div class="right-head">
          <span class="right-title">今日行程</span>
          <span id="selectedHint" class="selected-hint"></span>
        </div>
        <div id="timeline" class="timeline"></div>
      </section>
    </div>
  </div>

  <div id="mapPane" class="page-pane">
    <div class="map-toolbar">
      <button id="mapReset" class="tool-btn" type="button">重設縮放</button>
      <span class="zoom-label">雙指縮放／單指拖曳／點時間看名稱</span>
    </div>
    <p class="map-note">地圖會顯示已排進「今日行程」且有固定位置的設施、表演與餐廳，並依時間先後用箭頭連線。只有「其他用餐／點心」這類沒有固定位置的自訂項目不會畫在地圖上。</p>

  function flash(msg){
    toast.textContent=msg;
    toast.classList.add('show');
    clearTimeout(flash.t);
    flash.t=setTimeout(()=>toast.classList.remove('show'),1300);

  function save(){
    const payload={items,plans,updatedAt:Date.now()};
    try{
      localStorage.setItem(KEY,JSON.stringify({items,plans}));
      saveState.textContent=currentUser ? '本機已儲存・同步中' : '本機已儲存';
    }catch(e){
      saveState.textContent='本機無法儲存';
    }
    if(currentUser && remoteReady && !applyingRemote){
      sharedRef.set(payload).then(()=>{
        saveState.textContent='已同步';
        syncBar.textContent='☁ 已與共同行程同步';
      }).catch(err=>{
        saveState.textContent='同步受限';
        syncBar.textContent='已登入，但資料庫權限尚未開放（下一步會設定）';
        console.warn('Firebase sync failed:',err);
      });
    }
  }

  function mergeSaved(savedItems){
    if(!Array.isArray(savedItems)) return officialDefaults.map(x=>({...x,maintenance:!!x.maintenance}));
    const defaultsById=new Map(officialDefaults.map(x=>[x.id,{...x,maintenance:!!x.maintenance}]));
    const result=[];
    const used=new Set();

    // Preserve previous order for items that still exist.
    savedItems.forEach(old=>{
      const mapped=legacyIdMap[old.id] || old.id;
      if(defaultsById.has(mapped) && !used.has(mapped)){
        const base=defaultsById.get(mapped);
        result.push({
          ...base,
          maintenance: typeof old.maintenance==='boolean' ? old.maintenance : base.maintenance
        });
        used.add(mapped);
      }
    });

    // Add all newly introduced official items.
    officialDefaults.forEach(d=>{
      if(!used.has(d.id)){
        result.push({...d,maintenance:!!d.maintenance});
        used.add(d.id);
      }
    });

    return result;
  }

  function load(){
    try{
      const raw=localStorage.getItem(KEY);
      if(raw){
        const data=JSON.parse(raw);
        items=mergeSaved(data.items);
        if(Array.isArray(data.plans)) plans=data.plans;
        return;
      }

      // Migrate v3 automatically so previous ranking/schedule is not lost.
      const oldRaw=localStorage.getItem(OLD_KEY);
      if(oldRaw){
        const old=JSON.parse(oldRaw);
        items=mergeSaved(old.items);
        if(Array.isArray(old.plans)){
          plans=old.plans
            .map(p=>({...p,itemId:legacyIdMap[p.itemId]||p.itemId}))
            .filter(p=>items.some(i=>i.id===p.itemId));
        }
        save();
      }
    }catch(e){}
  }

  function formatTime(m){
    return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
  }

  function getSlotH(){
    return parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--slot-h'))||38;
  }

  function sortedCategoryItems(type){
    const arr=items.filter(x=>x.type===type);
    return [...arr.filter(x=>!x.maintenance),...arr.filter(x=>x.maintenance)];
  }

  function renderSources(){
    sourceLists.innerHTML='';
    ['DPA','PP','NORMAL','RESTAURANT'].forEach(type=>{
      const list=sortedCategoryItems(type);
      const wrap=document.createElement('div');
      wrap.className='category';
      wrap.innerHTML=`<div class="category-title"><span class="dot ${categoryInfo[type].dot}"></span>${categoryInfo[type].label}<span class="category-count">${list.length}</span></div>`;
      wrap.querySelector('.category-title').addEventListener('click',()=>wrap.classList.toggle('collapsed'));

      list.forEach(item=>{
        const card=document.createElement('div');
        card.className='item-card'+(selectedId===item.id?' selected':'')+(item.maintenance?' maintenance':'');
        card.dataset.area=item.area||'';
        const meta=[item.subtype,item.area,`約 ${item.duration} 分鐘`].filter(Boolean).join('・');
        card.innerHTML=`
          <div class="card-name">${item.name}</div>
          <div class="card-meta">${meta}</div>
          ${item.maintenance?`<span class="badge-maint">維修中</span>`:''}
          <div class="move-row">
            <button type="button" class="mini-btn up">↑</button>
            <button type="button" class="mini-btn down">↓</button>
            ${item.maintenance?`<button type="button" class="mini-btn maint-btn cancel-maint">取消維修</button>`:''}
          </div>`;

        card.addEventListener('click',e=>{
          if(e.target.closest('button')) return;
          selectedId=selectedId===item.id?null:item.id;
          selectedHint.textContent=selectedId?'已選：'+item.name:'';
          renderSources();
        });

        card.querySelector('.up').addEventListener('click',()=>moveItem(item.id,-1));
        card.querySelector('.down').addEventListener('click',()=>moveItem(item.id,1));

        const cancel=card.querySelector('.cancel-maint');
        if(cancel){
          cancel.addEventListener('click',()=>{
            item.maintenance=false;
            save(); renderSources(); renderTimeline();
            flash(item.name+'：已取消維修標記');
          });
        }

        card.addEventListener('pointerdown',e=>startSourceDrag(e,item,card));
        wrap.appendChild(card);
      });

      sourceLists.appendChild(wrap);
    });
  }

  function moveItem(id,delta){
    const item=items.find(x=>x.id===id);
    if(!item) return;

    // Maintenance items always stay after active items.
    const peers=items
      .map((x,i)=>({x,i}))
      .filter(v=>v.x.type===item.type && !!v.x.maintenance===!!item.maintenance);
    const pos=peers.findIndex(v=>v.x.id===id);
    const target=peers[pos+delta];
    if(!target) return;

    const a=items.findIndex(x=>x.id===id);
    const b=target.i;
    [items[a],items[b]]=[items[b],items[a]];
    save(); renderSources();
    flash('志願序已儲存');
  }

  function renderTimeline(){
    timeline.innerHTML='';
    for(let h=10;h<22;h++){
      const hour=document.createElement('div');
      hour.className='hour';
      hour.innerHTML=`<div class="hour-label">${String(h).padStart(2,'0')}:00</div>`;
      for(let q=0;q<4;q++){
        const line=document.createElement('div');
        line.className='quarter';
        hour.appendChild(line);
      }
      timeline.appendChild(hour);
    }
    const end=document.createElement('div');
    end.className='end-label';
    end.textContent='22:00';
    timeline.appendChild(end);
    plans.forEach(addPlanElement);
    if(mapPane.classList.contains('active')) renderMap();
  }

  function addPlanElement(plan){
    const item=items.find(x=>x.id===plan.itemId);
    if(!item)return;

    const el=document.createElement('div');
    let extra='';
    if(plan.obtained && item.type==='DPA') extra+=' obtained-dpa';
    if(plan.obtained && item.type==='PP') extra+=' obtained-pp';
    if(item.maintenance) extra+=' maint-plan';
    el.className='scheduled'+extra;
    el.dataset.area=item.area||'';

    const slots=Math.max(1,item.duration/15);
    el.style.top=(((plan.minutes-600)/15)*getSlotH()+2)+'px';
    el.style.height=Math.max(34,slots*getSlotH()-4)+'px';

    const eligible=item.type==='DPA'||item.type==='PP';
    el.innerHTML=`
      <button type="button" class="remove" aria-label="刪除">×</button>
      <div class="scheduled-head">
        <div class="scheduled-name">${item.name}</div>
        ${eligible?`<span class="type-badge">${item.type}</span>`:''}
      </div>
      <div class="scheduled-time">${formatTime(plan.minutes)} · ${item.duration} 分</div>
      ${item.maintenance?`<div class="plan-maint">⚠ 維修中</div>`:''}
      ${eligible?`<button type="button" class="obtain-btn">${plan.obtained?'✓ 已取得 '+item.type:'標記已取得'}</button>`:''}
    `;

    el.querySelector('.remove').addEventListener('click',e=>{
      e.stopPropagation();
      plans=plans.filter(p=>p.planId!==plan.planId);
      save(); renderTimeline();
    });

    const obtain=el.querySelector('.obtain-btn');
    if(obtain){
      obtain.addEventListener('pointerdown',e=>e.stopPropagation());
      obtain.addEventListener('click',e=>{
        e.stopPropagation();
        plan.obtained=!plan.obtained;
        save(); renderTimeline();
        flash(plan.obtained?item.type+' 已取得':'已取消取得狀態');
      });
    }

    el.addEventListener('pointerdown',e=>startPlanDrag(e,plan,el,item));
    timeline.appendChild(el);
  }

  function pointerMinutes(clientY){
    const r=timeline.getBoundingClientRect();
    const y=Math.max(0,Math.min(r.height-1,clientY-r.top));
    return Math.max(600,Math.min(1305,600+Math.round(y/getSlotH())*15));
  }

  function addPlan(itemId,minutes){
    const item=items.find(x=>x.id===itemId);
    if(!item)return;
    minutes=Math.min(minutes,1320-item.duration);
    plans.push({
      planId:'p'+Date.now()+Math.random().toString(16).slice(2),
      itemId,minutes,obtained:false
    });
    selectedId=null;
    selectedHint.textContent='';
    save(); renderSources(); renderTimeline();
    flash('已加入 '+formatTime(minutes));
  }

  timeline.addEventListener('click',e=>{
    if(e.target.closest('.scheduled')||!selectedId)return;
    addPlan(selectedId,pointerMinutes(e.clientY));
  });

  function makeGhost(text,x,y){
    const g=document.createElement('div');
    g.className='drag-ghost';
    g.textContent=text;
    g.style.left=x+'px';g.style.top=y+'px';
    document.body.appendChild(g);
    return g;
  }


  let autoScrollRaf = null;
  let autoScrollSpeed = 0;
  let lastDragClientY = null;

  function updateAutoScroll(clientY){
    lastDragClientY = clientY;
    const edge = Math.max(70, Math.min(120, window.innerHeight * 0.16));
    const maxSpeed = 18;

    if(clientY < edge){
      const strength = Math.max(0, Math.min(1, (edge - clientY) / edge));
      autoScrollSpeed = -Math.max(3, maxSpeed * strength);
    }else if(clientY > window.innerHeight - edge){
      const strength = Math.max(0, Math.min(1, (clientY - (window.innerHeight - edge)) / edge));
      autoScrollSpeed = Math.max(3, maxSpeed * strength);
    }else{
      autoScrollSpeed = 0;
    }

    if(autoScrollSpeed !== 0 && autoScrollRaf === null){
      runAutoScroll();
    }
  }

  function runAutoScroll(){
    if(autoScrollSpeed === 0){
      autoScrollRaf = null;
      return;
    }

    window.scrollBy(0, autoScrollSpeed);

    // During scrolling, keep the dragged item's target time synced with
    // the same finger position even though the page underneath is moving.
    if(drag && lastDragClientY !== null){
      const r = timeline.getBoundingClientRect();
      const insideY = lastDragClientY >= r.top && lastDragClientY <= r.bottom;
      if(insideY){
        drag.y = lastDragClientY;
      }
    }

    autoScrollRaf = requestAnimationFrame(runAutoScroll);
  }

  function stopAutoScroll(){
    autoScrollSpeed = 0;
    lastDragClientY = null;
    if(autoScrollRaf !== null){
      cancelAnimationFrame(autoScrollRaf);
      autoScrollRaf = null;
    }
  }

  function startSourceDrag(e,item,card){
    if(e.target.closest('button'))return;
    const sx=e.clientX,sy=e.clientY;
    let moved=false,g=null;
    card.setPointerCapture(e.pointerId);

    const move=ev=>{
      if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>7){
        moved=true;card.classList.add('dragging');g=makeGhost(item.name,ev.clientX,ev.clientY);
      }
      if(!moved)return;
      g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px';
      updateAutoScroll(ev.clientY);
      const r=timeline.getBoundingClientRect();
      const inside=ev.clientX>=r.left&&ev.clientX<=r.right&&ev.clientY>=r.top&&ev.clientY<=r.bottom;
      timeline.classList.toggle('drop-highlight',inside);
      drag={inside,y:ev.clientY};
    };

    const end=()=>{
      card.removeEventListener('pointermove',move);
      card.removeEventListener('pointerup',end);
      card.removeEventListener('pointercancel',end);
      card.classList.remove('dragging');
      timeline.classList.remove('drop-highlight');
      stopAutoScroll();
      g?.remove();
      if(moved&&drag?.inside)addPlan(item.id,pointerMinutes(drag.y));
      drag=null;
    };

    card.addEventListener('pointermove',move);
    card.addEventListener('pointerup',end);
    card.addEventListener('pointercancel',end);
  }

  function startPlanDrag(e,plan,el,item){
    if(e.target.closest('button'))return;
    const startY=e.clientY,original=plan.minutes;
    el.setPointerCapture(e.pointerId);

    const move=ev=>{
      if(Math.abs(ev.clientY-startY)<3)return;
      updateAutoScroll(ev.clientY);
      let next=original+Math.round((ev.clientY-startY)/getSlotH())*15;
      next=Math.max(600,Math.min(1320-item.duration,next));
      plan.minutes=next;
      el.style.top=(((next-600)/15)*getSlotH()+2)+'px';
      el.querySelector('.scheduled-time').textContent=`${formatTime(next)} · ${item.duration} 分`;
    };

    const end=()=>{
      el.removeEventListener('pointermove',move);
      el.removeEventListener('pointerup',end);
      el.removeEventListener('pointercancel',end);
      stopAutoScroll();
      save();renderTimeline();
    };

    el.addEventListener('pointermove',move);
    el.addEventListener('pointerup',end);
    el.addEventListener('pointercancel',end);
  }


  const mapCoords = {"beauty": [61.5, 19], "baymax-ride": [75.5, 58], "splash": [21, 49], "harmony": [54, 55], "electrical": [53, 55], "reach-stars": [56, 41], "mickey-music": [62, 18], "thunder": [22, 35], "star-tours": [77, 69], "monsters": [80, 61], "pooh": [64, 25], "haunted": [50, 21], "omnibus": [54, 82], "penny-arcade": [53, 86], "western-river": [21, 60], "pirates": [33, 70], "jungle-cruise": [29, 66], "tiki-stitch": [34, 62], "swiss-treehouse": [34, 68], "shooting-gallery": [28, 48], "country-bear": [32, 44], "mark-twain": [31, 29], "tom-sawyer": [31, 25], "beaver-canoes": [26, 21], "alice-tea": [58, 28], "small-world": [67, 31], "snow-white": [53, 31], "peter-pan": [48, 29], "pinocchio": [55, 28], "philhar": [57, 34], "cinderella-hall": [56, 39], "castle-carrousel": [58, 26], "dumbo": [63, 26], "gadget": [77, 29], "goofy-paint": [80, 35], "chip-treehouse": [80, 29], "toon-park": [78, 34], "donald-boat": [83, 32], "minnie-house": [78, 26], "roger-rabbit": [84, 37], "stitch-encounter": [73, 64], "baymax-cooldown": [55, 55], "jamboree": [72, 62], "rainbow-luau": [31, 65], "sky-colors": [55, 44], "party-gras": [32, 61], "diamond-variety": [27, 45], "greet-donald": [31, 40], "greet-daisy": [33, 40], "greet-mickey": [78, 30], "greet-minnie": [77, 26], "greet-mainstreet": [54, 83], "rest-eastside": [59, 80], "rest-centerstreet": [56, 78], "rest-hokusai": [48, 81], "rest-crystal": [42, 59], "rest-polynesian": [30, 60], "rest-china-voyager": [31, 65], "rest-camp-woodchuck": [19, 31], "rest-hungry-bear": [26, 47], "rest-plaza-pavilion": [38, 48], "rest-queen-hearts": [62, 30], "rest-grandma-sara": [21, 48], "rest-tomorrowland-terrace": [67, 60], "rest-pan-galactic": [74, 65]};
  let mapScale=1, mapX=0, mapY=0, activeMapPin=null;
  const mapPointers=new Map();
  let lastPinchDistance=null, lastPanPoint=null;

  function switchPage(page){
    const isMap=page==='map';
    scheduleTab.classList.toggle('active',!isMap);
    mapTab.classList.toggle('active',isMap);
    schedulePane.classList.toggle('active',!isMap);
    mapPane.classList.toggle('active',isMap);
    if(isMap) renderMap();
  }

  scheduleTab.addEventListener('click',()=>switchPage('schedule'));
  mapTab.addEventListener('click',()=>switchPage('map'));

  function applyMapTransform(){
    mapStage.style.transform=`translate(${mapX}px,${mapY}px) scale(${mapScale})`;
  }

  function resetMap(){
    mapScale=1; mapX=0; mapY=0; activeMapPin=null; lastPinchDistance=null; lastPanPoint=null;
    applyMapTransform();
    renderMap();
  }
  document.getElementById('mapReset').addEventListener('click',resetMap);

  function getMapPlans(){
    return plans
      .map(p=>({...p,item:items.find(i=>i.id===p.itemId)}))
      .filter(p=>p.item && mapCoords[p.itemId])
      .sort((a,b)=>a.minutes-b.minutes);
  }

  function renderMap(){
    const ordered=getMapPlans();
    mapMarkers.innerHTML='';
    routeSvg.querySelectorAll('.route-line').forEach(n=>n.remove());
    mapEmpty.style.display=ordered.length?'none':'flex';

    for(let i=0;i<ordered.length-1;i++){
      const a=mapCoords[ordered[i].itemId], b=mapCoords[ordered[i+1].itemId];
      const x1=a[0]*10, y1=a[1]*5.63, x2=b[0]*10, y2=b[1]*5.63;
      const line=document.createElementNS('http://www.w3.org/2000/svg','path');
      const dx=x2-x1, dy=y2-y1;
      const bend=Math.min(55,Math.hypot(dx,dy)*0.16);
      const mx=(x1+x2)/2 + (dy===0?0:Math.sign(dy)*bend*0.25);
      const my=(y1+y2)/2 - (dx===0?0:Math.sign(dx)*bend*0.25);
      line.setAttribute('d',`M ${x1} ${y1} Q ${mx} ${my} ${x2} ${y2}`);
      line.setAttribute('class','route-line');
      line.setAttribute('marker-end','url(#arrowHead)');
      routeSvg.appendChild(line);
    }

    ordered.forEach((p,idx)=>{
      const [x,y]=mapCoords[p.itemId];
      const btn=document.createElement('button');
      btn.type='button';
      btn.className='map-pin';
      btn.style.left=x+'%'; btn.style.top=y+'%';
      btn.textContent=formatTime(p.minutes);
      btn.setAttribute('aria-label',`${formatTime(p.minutes)} ${p.item.name}`);
      btn.addEventListener('pointerdown',e=>e.stopPropagation());
      btn.addEventListener('click',e=>{
        e.stopPropagation();
        activeMapPin = activeMapPin===p.planId ? null : p.planId;
        renderMap();
      });
      if(activeMapPin===p.planId){
        btn.classList.add('active');
        const pop=document.createElement('div');
        pop.className='map-popup';
        pop.style.left=x+'%'; pop.style.top=y+'%';
        pop.innerHTML=`<strong>${formatTime(p.minutes)}｜${p.item.name}</strong>${p.item.area||''}${p.item.type!=='NORMAL'?'・'+p.item.type:''}`;
        mapMarkers.appendChild(pop);
      }
      mapMarkers.appendChild(btn);
    });
  }

  mapShell.addEventListener('wheel',e=>{
    e.preventDefault();
    const rect=mapShell.getBoundingClientRect();
    const px=e.clientX-rect.left, py=e.clientY-rect.top;
    const old=mapScale;
    const next=Math.max(1,Math.min(4,old*(e.deltaY<0?1.16:.86)));
    mapX=px-(px-mapX)*(next/old);
    mapY=py-(py-mapY)*(next/old);
    mapScale=next;
    if(mapScale===1){mapX=0;mapY=0;}
    applyMapTransform();
  },{passive:false});

  mapShell.addEventListener('pointerdown',e=>{
    if(e.target.closest('.map-pin')) return;
    mapShell.setPointerCapture(e.pointerId);
    mapPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(mapPointers.size===1) lastPanPoint={x:e.clientX,y:e.clientY};
    if(mapPointers.size===2){
      const pts=[...mapPointers.values()];
      lastPinchDistance=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
    }
  });

  mapShell.addEventListener('pointermove',e=>{
    if(!mapPointers.has(e.pointerId)) return;
    mapPointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const pts=[...mapPointers.values()];
    if(pts.length===2){
      const d=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
      const cx=(pts[0].x+pts[1].x)/2, cy=(pts[0].y+pts[1].y)/2;
      const rect=mapShell.getBoundingClientRect();
      if(lastPinchDistance){
        const old=mapScale;
        const next=Math.max(1,Math.min(4,old*(d/lastPinchDistance)));
        const px=cx-rect.left, py=cy-rect.top;
        mapX=px-(px-mapX)*(next/old);
        mapY=py-(py-mapY)*(next/old);
        mapScale=next;
        if(mapScale===1){mapX=0;mapY=0;}
      }
      lastPinchDistance=d;
      applyMapTransform();
    } else if(pts.length===1 && mapScale>1 && lastPanPoint){
      mapX += e.clientX-lastPanPoint.x;
      mapY += e.clientY-lastPanPoint.y;
      const rect=mapShell.getBoundingClientRect();
      const maxX=rect.width*(mapScale-1), maxY=rect.height*(mapScale-1);
      mapX=Math.min(0,Math.max(-maxX,mapX));
      mapY=Math.min(0,Math.max(-maxY,mapY));
      lastPanPoint={x:e.clientX,y:e.clientY};
      applyMapTransform();
    }
  });

  function endMapPointer(e){
    mapPointers.delete(e.pointerId);
    lastPinchDistance=null;
    const pts=[...mapPointers.values()];
    lastPanPoint=pts.length===1?{...pts[0]}:null;
  }
  mapShell.addEventListener('pointerup',endMapPointer);
  mapShell.addEventListener('pointercancel',endMapPointer);

  document.getElementById('clearTimeline').addEventListener('click',()=>{
    askConfirm('確定要清空目前時間軸嗎？已安排的行程會全部移除，但左側志願序與維修設定會保留。', ()=>{
      plans=[];
      save();
      renderTimeline();
      if(typeof renderMap === 'function') renderMap();
      flash('時間軸已清空');
    });
  });

  function resetToOfficialDefaults(){
    // 完全由不可變的官方基準資料重建，不沿用任何手動維修狀態。
    items = officialDefaults.map(x => ({
      ...x,
      maintenance: x.maintenance === true
    }));
    plans = [];
    selectedId = null;
    activeMapPin = null;
    selectedHint.textContent = '';

    save();

    renderSources();
    renderTimeline();
    if (typeof renderMap === 'function') renderMap();
    flash('已恢復官方預設');
  }

  document.getElementById('resetAll').addEventListener('click', ()=>{
    askConfirm('確定要恢復 2026/8/27 官方預設嗎？這會重設志願序、維修狀態、DPA／PP 取得狀態與時間軸。', resetToOfficialDefaults);
  });

  function attachRemoteSync(){
    if(remoteListenerAttached) return;
    remoteListenerAttached=true;
    sharedRef.on('value', snap=>{
      remoteReady=true;
      const data=snap.val();
      if(data && Array.isArray(data.items) && Array.isArray(data.plans)){
        applyingRemote=true;
        items=mergeSaved(data.items);
        plans=data.plans.filter(p=>items.some(i=>i.id===p.itemId));
        try{ localStorage.setItem(KEY,JSON.stringify({items,plans})); }catch(e){}
        renderSources();
        renderTimeline();
        if(typeof renderMap==='function') renderMap();
        applyingRemote=false;
        saveState.textContent='已同步';
        syncBar.textContent='☁ 已與共同行程同步';
      }else if(!data){
        // First authorized user seeds the shared trip with their current local state.
        save();
      }
    }, err=>{
      remoteReady=false;
      syncBar.textContent='已登入，但資料庫權限尚未開放（下一步會設定）';
      saveState.textContent='本機已儲存';
      console.warn('Realtime Database permission:',err);
    });
  }

  authBtn.addEventListener('click', async ()=>{
    if(currentUser){
      await auth.signOut();
      return;
    }
    try{
      const provider=new firebase.auth.GoogleAuthProvider();
      await auth.signInWithPopup(provider);
    }catch(err){
      console.warn(err);
      if(err && err.code==='auth/unauthorized-domain'){
        flash('需先把 GitHub 網域加入 Firebase 授權');
      }else{
        flash('Google 登入未完成');
      }
    }
  });

  copyUidBtn.addEventListener('click', async ()=>{
    if(!currentUser) return;
    try{
      await navigator.clipboard.writeText(currentUser.uid);
      flash('UID 已複製');
    }catch(e){
      prompt('請複製這組 UID',currentUser.uid);
    }
  });

  auth.onAuthStateChanged(user=>{
    currentUser=user||null;
    if(currentUser){
      authBtn.textContent='登出';
      copyUidBtn.style.display='';
      syncBar.textContent='已登入：'+(currentUser.displayName||currentUser.email||'Google 使用者')+'｜UID：'+currentUser.uid;
      attachRemoteSync();
    }else{
      authBtn.textContent='Google 登入';
      copyUidBtn.style.display='none';
      syncBar.textContent='尚未登入｜目前先使用本機資料';
      saveState.textContent='本機已儲存';
      if(remoteListenerAttached){
        sharedRef.off();
        remoteListenerAttached=false;
      }
      remoteReady=false;
    }
  });

  window.addEventListener('resize',renderTimeline);

  load();
  renderSources();
  renderTimeline();
})();
</script>
